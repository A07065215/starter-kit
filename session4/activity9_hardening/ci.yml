# Copy this file to  .github/workflows/ci.yml  in YOUR repo.
# It runs the tests on every push and pull request; Streamlit Cloud then
# deploys whatever is on your main branch, so a red check = do not merge.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python make_data.py   # only needed if your tests read generated data
      - run: pytest -q
